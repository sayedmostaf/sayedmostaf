<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8ccbff"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <clipPath id="clip"><rect width="1200" height="280" rx="24"/></clipPath>
</defs>
<style>
  .f1{animation:f1 9s ease-in-out infinite alternate} .f2{animation:f2 11s ease-in-out infinite alternate} .f3{animation:f3 13s ease-in-out infinite alternate}
  @keyframes f1{to{transform:translate(160px,30px)}} @keyframes f2{to{transform:translate(-180px,-20px)}} @keyframes f3{to{transform:translate(90px,-40px)}}
  .in{animation:in 1.2s ease-out both} @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .d2{animation-delay:.25s} .d3{animation-delay:.5s}

  .t{opacity:0;animation:t 9s infinite}.t2{animation-delay:3s}.t3{animation-delay:6s}
  @keyframes t{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
  .bob{transform-origin:150px 100px;animation:bob 1.1s ease-in-out infinite alternate}@keyframes bob{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-2px)}}
  .h1{animation:h 0.28s ease-in-out infinite alternate}.h2{animation:h 0.28s ease-in-out .14s infinite alternate}@keyframes h{to{transform:translateY(-4px)}}
  .st{animation:st 2.2s ease-in-out infinite}.st2{animation-delay:.7s}.st3{animation-delay:1.4s}@keyframes st{0%{opacity:0;transform:translateY(4px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
  .scr{animation:blink .9s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .bug{animation:bug 3s ease-in-out infinite}@keyframes bug{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="280" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".75">
    <circle class="f1" cx="220" cy="90" r="120" fill="#0175C2"/>
    <circle class="f2" cx="900" cy="200" r="130" fill="#7F52FF"/>
    <circle class="f3" cx="560" cy="60" r="90" fill="#2E9EF7"/>
  </g>
  <g opacity=".07" stroke="#fff"><path d="M0 70H1200M0 140H1200M0 210H1200M150 0V280M300 0V280M450 0V280M600 0V280M750 0V280M900 0V280M1050 0V280"/></g>
  <text class="in" x="600" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#name)" letter-spacing="-2">Sayed Mostafa</text>
  <text class="in d2" x="600" y="176" text-anchor="middle" font-family="-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#c9d1d9">Flutter Developer  ·  Mobile Software Engineer</text>
  <g class="in d3" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#e6edf3" text-anchor="middle">
    <rect x="330" y="204" width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/><text x="405" y="226">Clean Architecture</text>
    <rect x="495" y="204" width="100" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/><text x="545" y="226">BLoC</text>
    <rect x="610" y="204" width="110" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/><text x="665" y="226">Firebase</text>
    <rect x="735" y="204" width="130" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/><text x="800" y="226">Supabase</text>
  </g>

  <g id="dev" transform="translate(965 20)">
    <!-- speech bubble -->
    <rect x="0" y="0" width="210" height="36" rx="12" fill="#ffffff" fill-opacity=".96"/>
    <path d="M150 35l8 12 8-12z" fill="#ffffff" fill-opacity=".96"/>
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">
      <text class="t" x="105" y="23">It works on my machine</text>
      <text class="t t2" x="105" y="23">git push --force</text>
      <text class="t t3" x="105" y="23">// TODO: fix later</text>
    </g>
    <!-- coffee -->
    <g transform="translate(34 128)">
      <rect x="0" y="0" width="26" height="30" rx="5" fill="#f0f6fc"/><path d="M26 7h6a6 6 0 0 1 0 14h-6" fill="none" stroke="#f0f6fc" stroke-width="4"/>
      <rect x="3" y="3" width="20" height="8" rx="3" fill="#7b4a2b"/>
      <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path class="st" d="M7 -4q4 -6 0 -12"/><path class="st st2" d="M13 -4q4 -6 0 -12"/><path class="st st3" d="M19 -4q4 -6 0 -12"/>
      </g>
    </g>
    <!-- developer head -->
    <g class="bob">
      <path d="M118 128c0-18 14-30 32-30s32 12 32 30z" fill="#7F52FF"/>
      <circle cx="150" cy="86" r="27" fill="#FFCE54"/>
      <path d="M124 80c2-20 16-26 28-26 14 0 24 8 26 26-8-8-18-12-28-12s-18 4-26 12z" fill="#3b2a20"/>
      <rect x="128" y="80" width="21" height="13" rx="5" fill="#0d1117"/><rect x="152" y="80" width="21" height="13" rx="5" fill="#0d1117"/><path d="M149 85h3" stroke="#0d1117" stroke-width="3"/>
      <path d="M131 83l6-1M155 83l6-1" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
      <path d="M140 102q10 8 20 0" fill="none" stroke="#7a3b1e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- laptop (back) -->
    <rect x="90" y="120" width="120" height="58" rx="7" fill="#c9d1d9"/>
    <rect x="86" y="176" width="128" height="7" rx="3.5" fill="#8b949e"/>
    <g class="bug"><ellipse cx="150" cy="149" rx="9" ry="10" fill="#FF3A44"/><path d="M150 139v20M141 145h-5M159 145h5M141 153h-5M159 153h5" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/><circle cx="147" cy="146" r="1.8" fill="#0d1117"/><circle cx="153" cy="152" r="1.8" fill="#0d1117"/><circle cx="150" cy="138" r="3.5" fill="#0d1117"/></g>
    <!-- hands -->
    <circle class="h1" cx="120" cy="124" r="8" fill="#FFCE54"/><circle class="h2" cx="180" cy="124" r="8" fill="#FFCE54"/>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="279" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>